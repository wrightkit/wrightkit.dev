# Dependabot version updates for wrightkit.dev.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Site dependencies (pnpm lockfile at the repo root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  # CI workflows and their action pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
